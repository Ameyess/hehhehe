<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rhetoric Trainer</title>
<style>
  :root { --fg:#000; --bg:#fff; --mute:#555; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font-family: Georgia, "Times New Roman", serif; line-height:1.6; }
  main { max-width: 46rem; margin: 0 auto; padding: 2rem 1.25rem 4rem; }
  h1 { font-size: 1.6rem; margin: 0 0 .25rem; font-weight: 700; }
  .sub { color: var(--mute); margin: 0 0 1.5rem; }
  .bar { display:flex; flex-wrap:wrap; gap:1rem; align-items:center; border-top:1px solid var(--fg); border-bottom:1px solid var(--fg); padding:.75rem 0; margin-bottom:1.5rem; }
  .bar label { display:flex; gap:.5rem; align-items:center; }
  .stats { margin-left:auto; display:flex; gap:1.25rem; }
  select, textarea, button { font: inherit; color: inherit; background: var(--bg); border: 1px solid var(--fg); border-radius: 0; }
  select { padding:.3rem .5rem; }
  button { padding:.5rem 1rem; cursor:pointer; }
  button.primary { background: var(--fg); color: var(--bg); }
  button:disabled { opacity:.4; cursor:default; }
  :focus-visible { outline: 3px solid var(--fg); outline-offset: 2px; }
  .passage { border-left: 3px solid var(--fg); padding: .25rem 0 .25rem 1.25rem; margin: 0 0 1.5rem; font-size: 1.08rem; }
  .passage p { margin: 0 0 .9rem; }
  .question { font-weight: 700; margin: 0 0 .75rem; }
  textarea { width:100%; min-height: 10rem; padding:.75rem; resize: vertical; }
  .row { display:flex; gap:.75rem; flex-wrap:wrap; margin-top:.75rem; }
  .result { border:1px solid var(--fg); padding:1rem 1.25rem; margin-top:1.5rem; }
  .result h2 { font-size:1.1rem; margin:0 0 .5rem; }
  .key { white-space: pre-wrap; border-top:1px solid var(--fg); margin-top:.75rem; padding-top:.75rem; }
  .note { color: var(--mute); font-size:.9rem; margin-top:.5rem; }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<main>
  <h1>Rhetoric Trainer</h1>
  <p class="sub">Read the passage. Answer the question. Passages never run out.</p>

  <div class="bar">
    <label for="skill">Focus
      <select id="skill">
        <option value="mixed">Mixed</option>
        <option value="thesis">Thesis (explicit or implicit)</option>
        <option value="tone">Tone (three words)</option>
        <option value="diction">Diction, mood, voice</option>
        <option value="proof">Methods of proof</option>
        <option value="devices">Rhetorical devices</option>
        <option value="appeals">Rhetorical appeals</option>
        <option value="development">Methods of development</option>
        <option value="structure">Structure and rhetorical triangle</option>
      </select>
    </label>
    <label for="levelmode">Difficulty
      <select id="levelmode">
        <option value="auto">Adaptive</option>
        <option value="1">Level 1</option><option value="2">Level 2</option>
        <option value="3">Level 3</option><option value="4">Level 4</option>
        <option value="5">Level 5</option>
      </select>
    </label>
    <div class="stats" aria-live="polite">
      <span>Level <b id="lvl">1</b></span>
      <span>Streak <b id="streak">0</b></span>
      <span>Average <b id="avg">–</b></span>
    </div>
  </div>

  <section id="stage" aria-live="polite">
    <p id="loading">Loading a passage…</p>
    <div id="game" hidden>
      <div class="passage" id="passage"></div>
      <p class="question" id="question"></p>
      <label for="answer" class="note" id="alabel">Your answer</label>
      <textarea id="answer" spellcheck="true"></textarea>
      <div class="row">
        <button class="primary" id="submit">Check answer</button>
        <button id="skip">Skip</button>
      </div>
      <p class="note" id="modenote"></p>
    </div>
    <div class="result" id="result" hidden>
      <h2 id="score"></h2>
      <p id="feedback"></p>
      <div class="key" id="key"></div>
      <div class="row" id="selfmark" hidden>
        <button data-s="10">I got it</button>
        <button data-s="5">Partly</button>
        <button data-s="0">I missed it</button>
      </div>
      <div class="row"><button class="primary" id="next">Next passage</button></div>
    </div>
  </section>
</main>

<script>
const BANK = [
 {
  "skill": "thesis",
  "passage": "Every spring, our council announces the same plan: resurface the main roads, patch the bridge, and postpone the library. Last year the library's roof leaked onto four hundred books, and the response was a committee. I do not believe a town is measured by the smoothness of its asphalt. A town is measured by what it chooses to keep dry. We can drive over a rough road at thirty kilometres an hour and still arrive; a child with no quiet place to read arrives nowhere at all. So I ask this council plainly: fund the library first, and let the roads wait one more year.",
  "question": "Identify the thesis statement. Is it explicit or implicit? Explain how you know.",
  "key": "Explicit thesis. The speaker states it directly, twice: \"A town is measured by what it chooses to keep dry\" (the controlling idea) and, most plainly, \"fund the library first, and let the roads wait one more year\" (the claim of policy). Signals of explicitness: the direct address (\"I ask this council plainly\"), the imperative verb, and the placement at the end after the supporting contrast."
 },
 {
  "skill": "thesis",
  "passage": "My grandfather kept every bent nail he ever pulled. They lived in coffee tins on a shelf above the vise, sorted by length, and on Saturdays he would flatten them one at a time on an anvil the size of a loaf of bread. I once told him a box of new nails cost less than an hour of his time. He did not argue. He held up a straightened nail, still crooked at the tip, and drove it into a plank with three clean strokes. \"It holds,\" he said, and reached for the next one. When he died, the tins were nearly empty. The house, which he had built from those nails and others like them, has not shifted an inch.",
  "question": "Identify the thesis statement. Is it explicit or implicit? Explain how you know.",
  "key": "Implicit thesis. No sentence states the main idea; the reader must infer it from the anecdote. A fair statement: patient repair and thrift, valuing what is imperfect but useful, outlast the convenient and new. Evidence: the \"bent nail\" that still \"holds,\" the grandfather's refusal to argue about cost, and the closing image of the house that \"has not shifted an inch.\" The narrative form and the absence of any direct claim or commentary mark the thesis as implied."
 },
 {
  "skill": "tone",
  "passage": "I was told the interview would be informal, which in my experience means that the questions are formal and the chairs are not. The panel of three smiled in unison, like a choir about to deliver bad news. \"Tell us about a failure,\" the first said. I had prepared for this, naturally, by rehearsing a failure so mild it could pass for a virtue: I care too much, I work too hard, I once stayed late to alphabetize the stationery cupboard. They nodded gravely and wrote something down. I like to imagine it was \"hire this person.\" I suspect it was \"stationery.\"",
  "question": "Identify the tone of this passage using three different words. Support each word with evidence from the text.",
  "key": "Acceptable tone words: wry, self-deprecating, sardonic, ironic, humorous, lightly cynical, conversational. Evidence: the paradox about \"informal\" (\"the questions are formal and the chairs are not\") is wry; the simile \"like a choir about to deliver bad news\" is sardonic and humorous; the narrator mocking his own rehearsed answer (\"a failure so mild it could pass for a virtue\") is self-deprecating; \"I suspect it was 'stationery'\" ends on deflating irony."
 },
 {
  "skill": "diction",
  "passage": "It is with considerable reluctance that I rise to oppose the amendment before this assembly. The honourable members have argued, with admirable diligence, that expedience should govern our deliberations. I submit that it should not. Where a principle is sacrificed for convenience, it is seldom restored, and the precedent we establish today shall bind our successors long after the present urgency has been forgotten. I therefore urge restraint.",
  "question": "Identify the diction used to create a specific mood or voice. Is the voice formal or informal? Cite at least three words or phrases.",
  "key": "Formal voice; mood is grave, measured, and respectful but firm. Diction: Latinate, abstract words (\"expedience,\" \"deliberations,\" \"precedent,\" \"successors\") and courtly phrases (\"honourable members,\" \"I submit,\" \"it is with considerable reluctance\"). Absence of contractions, slang, and first-person anecdote. \"Shall\" (not \"will\") and \"I rise\" signal parliamentary ritual. Short final sentence \"I therefore urge restraint\" gives solemn finality."
 },
 {
  "skill": "proof",
  "passage": "Consider what happens when a town plants trees. In 2015, Alder Falls lined its twelve hottest streets with maples; within five years, measured pavement temperatures there had fallen by nearly two degrees. Dr. Amara Okafor, who studies urban heat, puts it simply: shade is infrastructure. If one July afternoon can send forty residents to the emergency room, as it did here in 2021, then we are already paying for the trees we refuse to plant. And would any of us, offered a free air conditioner for every sidewalk, say no?",
  "question": "Identify at least three different methods of proof used in this passage. Quote or point to each one.",
  "key": "Methods of proof: (1) statistics/data: \"fallen by nearly two degrees,\" \"forty residents\"; (2) example/precedent: Alder Falls planting maples in 2015; (3) expert testimony/authority: Dr. Amara Okafor, \"shade is infrastructure\"; (4) cause and effect: heat sends residents to hospital, so inaction already has a cost; (5) analogy: trees as free air conditioners; (6) rhetorical question as appeal to common sense."
 },
 {
  "skill": "devices",
  "passage": "We have the tools. We have the talent. We have, God knows, the time, and still we wait. We wait for permission, for a sign, for someone braver to go first. But courage is not a gift handed out at birth; it is a muscle, and muscles are built by lifting what frightens us. The wall is not too high. The river is not too wide. Only our excuses are.",
  "question": "Identify at least three different rhetorical devices used in this passage. Quote each one and explain its effect.",
  "key": "Devices: anaphora (\"We have... We have... We have\"; \"We wait for...\"); tricolon/parallelism (\"the tools... the talent... the time\"; \"for permission, for a sign, for someone braver\"); metaphor (\"courage is... a muscle\"); antithesis (\"not a gift... it is a muscle\"); parallel short sentences building to ellipsis and reversal (\"Only our excuses are\"), which delivers a surprise punchline; parenthetical aside (\"God knows\") for emphasis."
 },
 {
  "skill": "appeals",
  "passage": "I have been a firefighter for twenty-two years, and I have knocked on the doors of houses that no longer had a second floor. I remember a boy's shoes lined up neatly by the stairs, waiting for a morning that did not come. Here is what the numbers say: a working smoke alarm cuts the risk of dying in a house fire by roughly half, and the battery costs less than a cup of coffee. Test yours tonight. It will take you ten seconds.",
  "question": "Identify the rhetorical appeals (ethos, pathos, logos) at work. Which one dominates? Give evidence for each you name.",
  "key": "Ethos: \"I have been a firefighter for twenty-two years\" establishes first-hand credibility. Pathos: the image of \"a boy's shoes lined up neatly by the stairs, waiting for a morning that did not come.\" Logos: the statistic (\"cuts the risk... by roughly half\") and the cost-benefit comparison (battery vs. coffee; ten seconds). Pathos dominates the middle, ethos opens, logos closes. The final imperatives turn all three into a call to action."
 },
 {
  "skill": "development",
  "passage": "What is silence? Most of us would say it is the absence of sound, but that is like calling a hole the absence of dirt: accurate and useless. In a library, silence is a shared agreement; in a hospital corridor at night, it is a held breath; between two people who have quarrelled, it is a wall built one unspoken word at a time. Compare the quiet of a forest, which hums with insects and wind, to the quiet of an empty apartment, which hums only with the refrigerator and your own thoughts. The first soothes because it includes you. The second unsettles because it does not. The problem, then, is not noise but belonging, and the remedy is not earplugs but company.",
  "question": "Identify the methods of development used in this passage (for example: definition, comparison/contrast, cause and effect, exemplification, narration, process, problem-solution, classification). Give evidence for each.",
  "key": "Methods of development: definition (opens by asking and redefining \"silence,\" including a definition-by-analogy with the hole); exemplification (library, hospital corridor, quarrel); comparison/contrast (forest vs. empty apartment); cause and effect (\"soothes because it includes you... unsettles because it does not\"); problem-solution (closing sentence: \"the problem... is not noise but belonging, and the remedy is... company\")."
 },
 {
  "skill": "structure",
  "passage": "What is silence? Most of us would say it is the absence of sound, but that is like calling a hole the absence of dirt: accurate and useless. In a library, silence is a shared agreement; in a hospital corridor at night, it is a held breath; between two people who have quarrelled, it is a wall built one unspoken word at a time. Compare the quiet of a forest, which hums with insects and wind, to the quiet of an empty apartment, which hums only with the refrigerator and your own thoughts. The first soothes because it includes you. The second unsettles because it does not. The problem, then, is not noise but belonging, and the remedy is not earplugs but company.",
  "question": "Consider how the passage is structured and how balanced the parts of the rhetorical triangle (speaker, audience, message) are. Which part is emphasized, and which is neglected?",
  "key": "Structure: opens with a rhetorical question, moves from definition to three examples, then a paired comparison, then a short two-sentence cause explanation, and closes with a compressed problem-solution thesis. It builds from broad to specific to a resolved claim (inductive movement). Triangle: message (logos) dominates, supported by vivid images; audience is addressed (\"your own thoughts,\" \"most of us\") and included; speaker is nearly absent (no credentials, no personal story), so ethos is the weakest corner. The balance is therefore message-heavy, audience-aware, speaker-light."
 }
];
const $ = (id) => document.getElementById(id);
const S = { level: 1, streak: 0, scores: [], cur: null, live: true, seen: new Set() };

function setStats() {
  $("lvl").textContent = S.level;
  $("streak").textContent = S.streak;
  $("avg").textContent = S.scores.length
    ? (S.scores.reduce((a, b) => a + b, 0) / S.scores.length).toFixed(1) + "/10" : "–";
}
function currentLevel() {
  const m = $("levelmode").value;
  return m === "auto" ? S.level : parseInt(m);
}
function offlinePick(skill) {
  let pool = BANK.filter((b) => skill === "mixed" || b.skill === skill);
  if (!pool.length) pool = BANK;
  let fresh = pool.filter((b) => !S.seen.has(b.passage));
  if (!fresh.length) { S.seen.clear(); fresh = pool; }
  return fresh[Math.floor(Math.random() * fresh.length)];
}
async function load() {
  $("game").hidden = true; $("result").hidden = true; $("loading").hidden = false;
  $("loading").textContent = "Loading a passage…";
  const skill = $("skill").value;
  try {
    const r = await fetch("/api/generate", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ skill, level: currentLevel() }),
    });
    if (!r.ok) throw new Error("bad status");
    S.cur = await r.json();
    if (!S.cur.passage) throw new Error("empty");
    S.live = true;
  } catch (e) {
    S.cur = offlinePick(skill); S.live = false;
    S.seen.add(S.cur.passage);
  }
  render();
}
function render() {
  const box = $("passage"); box.textContent = "";
  S.cur.passage.split(/\n+/).forEach((t) => { const p = document.createElement("p"); p.textContent = t; box.appendChild(p); });
  $("question").textContent = S.cur.question;
  $("answer").value = "";
  $("modenote").textContent = S.live ? "" : "Offline set: you will mark your own answer against the key.";
  $("submit").disabled = false; $("submit").textContent = "Check answer";
  $("loading").hidden = true; $("game").hidden = false; $("result").hidden = true;
  $("answer").focus();
}
function finish(score, feedback, showSelfMark) {
  S.scores.push(score);
  S.streak = score >= 7 ? S.streak + 1 : 0;
  if ($("levelmode").value === "auto") {
    if (score >= 8) S.level = Math.min(5, S.level + 1);
    else if (score <= 4) S.level = Math.max(1, S.level - 1);
  }
  setStats();
}
$("submit").onclick = async () => {
  const answer = $("answer").value.trim();
  if (!answer) { $("answer").focus(); return; }
  $("submit").disabled = true;
  $("key").textContent = "Model answer:\n" + S.cur.key;
  if (S.live) {
    $("submit").textContent = "Marking…";
    try {
      const r = await fetch("/api/grade", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ passage: S.cur.passage, question: S.cur.question, key: S.cur.key, answer }),
      });
      if (!r.ok) throw new Error("grade failed");
      const g = await r.json();
      $("score").textContent = "Score: " + g.score + " / 10";
      $("feedback").textContent = g.feedback;
      $("selfmark").hidden = true;
      finish(g.score);
    } catch (e) {
      $("score").textContent = "Marking unavailable";
      $("feedback").textContent = "Compare your answer with the model answer, then mark yourself.";
      $("selfmark").hidden = false;
    }
  } else {
    $("score").textContent = "Compare with the model answer";
    $("feedback").textContent = "Mark yourself honestly.";
    $("selfmark").hidden = false;
  }
  $("result").hidden = false;
  $("result").scrollIntoView({ behavior: "smooth", block: "nearest" });
};
document.querySelectorAll("#selfmark button").forEach((b) => {
  b.onclick = () => {
    const s = parseInt(b.dataset.s);
    $("score").textContent = "Self-marked: " + s + " / 10";
    $("selfmark").hidden = true;
    finish(s);
  };
});
$("next").onclick = load;
$("skip").onclick = load;
$("skill").onchange = load;
$("levelmode").onchange = () => { if ($("levelmode").value !== "auto") S.level = parseInt($("levelmode").value); setStats(); };
setStats(); load();
</script>
</body>
</html>
